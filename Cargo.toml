[package]
name = "skyward"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
# Sound (src/audio): cpal for device output (ALSA/Pulse/PipeWire, CoreAudio,
# WASAPI, WebAudio on wasm32), hound for the embedded speech clips and the
# offline WAV renderer. Synthesis / resampling / mixing is our own DSP.
cpal = "0.18.2"
hound = "3.5.1"
# Recorded engine / effect samples (FlightGear sound sets, assets/audio/samples):
# pure-Rust Ogg Vorbis decoder, also fine on wasm32.
lewton = "0.10.2"
earcutr = "0.5.0"
flate2 = "1"
egui = { version = "0.37", features = ["default_fonts"] }
# Game controllers (src/input): gamepads, joysticks / HOTAS, pedals, quadrants;
# hot-plug; Linux evdev, Windows WGI, macOS IOKit, web Gamepad API.
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
glam = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# JSBSim FDM aerodynamics (src/jsbsim.rs).
roxmltree = "0.20"
serde_json = "1.0.154"
# Instant / SystemTime that also work in the browser (re-exports std natively).
web-time = "1.1"
wgpu = "30"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-wgpu = "0.37"
egui-winit = "0.37"
pollster = "1.0.1"
ureq = "2"

# Browser build (src/platform/web.rs): WebGPU, fetch, localStorage, WebAudio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
console_error_panic_hook = "0.1.7"
# No WebGL backend, no system clipboard (arboard) in the browser.
egui-wgpu = { version = "0.37", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
egui-winit = { version = "0.37", default-features = false, features = ["links"] }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Window", "Location", "Storage",
    "Request", "RequestInit", "RequestMode", "Response", "Headers", "Navigator", "Performance",
    "CssStyleDeclaration", "AbortController", "AbortSignal", "ResponseInit",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent",
] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 0
strip = true

# Browser build (scripts/web-build.sh): like release, but keeps the wasm
# custom sections wasm-bindgen reads (strip = true drops them).
[profile.web]
inherits = "release"
strip = "debuginfo"

[target.'cfg(target_os = "linux")'.dependencies]
# Axis-only controllers (most rudder pedals) that gilrs skips (src/input/backend.rs).
evdev = { version = "0.13.2", default-features = false }

# CI runs `cargo clippy --all-targets -- -D warnings`. These lints are allowed
# crate-wide because the existing code base (and work in progress on other
# tracks) trips them; tighten one at a time once the tree is quiet.
[lints.rust]
dead_code = "allow"

[lints.clippy]
collapsible_if = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
manual_range_contains = "allow"
if_same_then_else = "allow"
needless_range_loop = "allow"
neg_multiply = "allow"
manual_clamp = "allow"
wrong_self_convention = "allow"
field_reassign_with_default = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
clone_on_copy = "allow"
doc_lazy_continuation = "allow"
int_plus_one = "allow"
manual_div_ceil = "allow"
manual_pattern_char_comparison = "allow"
match_ref_pats = "allow"
needless_borrow = "allow"
unnecessary_cast = "allow"
unnecessary_map_or = "allow"
useless_borrows_in_formatting = "allow"
