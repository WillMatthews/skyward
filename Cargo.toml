[package]
name = "skyward"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
# Sound (src/audio): cpal for device output (ALSA/Pulse/PipeWire, CoreAudio,
# WASAPI, WebAudio on wasm32), hound for the embedded speech clips and the
# offline WAV renderer. Synthesis / resampling / mixing is our own DSP.
cpal = "0.18.2"
hound = "3.5.1"
# Recorded engine / effect samples (FlightGear sound sets, assets/audio/samples):
# pure-Rust Ogg Vorbis decoder, also fine on wasm32.
lewton = "0.10.2"
earcutr = "0.5.0"
flate2 = "1"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
# Game controllers (src/input): gamepads, joysticks / HOTAS, pedals, quadrants;
# hot-plug; Linux evdev, Windows WGI, macOS IOKit, web Gamepad API.
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
glam = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
# JSBSim FDM aerodynamics (src/jsbsim.rs).
roxmltree = "0.20"
serde_json = "1.0.154"
ureq = "2"
wgpu = "30"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 0
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Axis-only controllers (most rudder pedals) that gilrs skips (src/input/backend.rs).
evdev = { version = "0.13.2", default-features = false }

# CI runs `cargo clippy --all-targets -- -D warnings`. These lints are allowed
# crate-wide because the existing code base (and work in progress on other
# tracks) trips them; tighten one at a time once the tree is quiet.
[lints.rust]
dead_code = "allow"

[lints.clippy]
collapsible_if = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
manual_range_contains = "allow"
if_same_then_else = "allow"
needless_range_loop = "allow"
neg_multiply = "allow"
manual_clamp = "allow"
wrong_self_convention = "allow"
field_reassign_with_default = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
clone_on_copy = "allow"
doc_lazy_continuation = "allow"
int_plus_one = "allow"
manual_div_ceil = "allow"
manual_pattern_char_comparison = "allow"
match_ref_pats = "allow"
needless_borrow = "allow"
unnecessary_cast = "allow"
unnecessary_map_or = "allow"
useless_borrows_in_formatting = "allow"
