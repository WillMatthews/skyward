[package]
name = "fgimport"
version = "0.1.0"
edition = "2024"
description = "Offline converter: FlightGear aircraft (AC3D + model XML + textures) -> Skyward runtime aircraft assets"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
roxmltree = "0.20"
serde_json = "1"
flate2 = "1"
glam = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
regex = "1"

[profile.dev]
opt-level = 2
