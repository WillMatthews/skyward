# Build, lint and test on every push / pull request.
#
#   check  — rustfmt (formatted paths), clippy -D warnings, unit tests, release build (Linux);
#            the workspace: the game, crates/skyward-net (protocol, lossy-link and
#            32-client tests) and crates/skyward-server
#   server — the dedicated server alone on Linux / Windows / macOS (no graphics
#            or audio dependencies), plus a start / clean-shutdown smoke test
#   tools  — the golden-comparison tool's own tests (tools/regress)
#   wasm   — wasm32: the browser build (src/platform/, tiles_web.rs) passes
#            clippy -D warnings; pages.yml builds and publishes the site
#
# GPU: runners have none; GPU-dependent tests are skipped (`--skip gpu_`) and
# golden-image / audio regression runs locally on a GPU (scripts/regress.sh).
# render.yml has an optional software-Vulkan (lavapipe) smoke render.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Keep in step with the toolchain the code is developed on: new clippy lints
  # land with new releases.
  RUST_VERSION: "1.98.1"

jobs:
  check:
    name: fmt · clippy · test · build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (ALSA for cpal, udev for gilrs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The code base predates a formatter config; files listed in
      # scripts/fmt-paths.txt are kept rustfmt-clean (rustfmt.toml) and checked.
      # Run `cargo fmt` on a quiet tree and switch to `cargo fmt --check` later.
      - name: rustfmt (formatted paths)
        run: scripts/fmt-check.sh

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: tests
        run: cargo test --locked -- --skip gpu_

      - name: release build
        run: cargo build --locked --release

  server:
    name: skyward-server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: build (server only)
        run: cargo build --locked --release -p skyward-server
      - name: no graphics / audio in the server's dependencies
        shell: bash
        run: |
          if cargo tree --locked -p skyward-server -e normal | grep -E ' (wgpu|winit|cpal|egui|gilrs) '; then
            echo "skyward-server must not depend on the game's renderer / audio / input" >&2
            exit 1
          fi
      - name: protocol + server tests
        run: cargo test --locked --release -p skyward-net -p skyward-server
      - name: smoke (start, answer, shut down)
        shell: bash
        run: |
          ./target/release/skyward-server --help
          # The console's `quit` shuts it down cleanly (exit status 0).
          (sleep 2; echo status; echo quit) | ./target/release/skyward-server --bind 127.0.0.1 --port 47999 --no-discovery --no-mdns --weather own

  tools:
    name: tools/regress tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/regress
      - name: test + clippy
        working-directory: tools/regress
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings

  wasm:
    name: wasm32 check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: clippy (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
